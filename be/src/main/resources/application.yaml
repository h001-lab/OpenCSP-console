spring:
  config:
    # .env 파일 로드 (프로젝트 루트 또는 be 디렉토리에서 찾음)
    import: optional:file:.env[.properties],optional:file:be/.env[.properties]

  application:
    name: OpenCSP

  # Spring AI 자동 구성 비활성화 — AiConfig 에서 조건부로 직접 등록
  # Spring AI 1.1.x 기준 패키지: org.springframework.ai.model.openai.autoconfigure.*
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/opencsp;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    hikari:
      # SQLite는 동시 쓰기를 지원하지 않으므로 커넥션 1개로 제한
      # H2/PostgreSQL/MySQL 사용 시 이 값을 늘려야 함
      maximum-pool-size: ${SPRING_DATASOURCE_POOL_SIZE:1}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

  # Spring AI: Vertex AI / OpenAI(호환) 설정
  # app.ai.enabled=true 일 때만 AiConfig 가 빈을 등록함 (기본값: false)
  ai:
    vertex:
      ai:
        gemini:
          project-id: ${SPRING_AI_VERTEX_PROJECT_ID:}
          location: ${SPRING_AI_VERTEX_LOCATION:us-central1}
          chat:
            options:
              model: ${SPRING_AI_VERTEX_CHAT_OPTIONS_MODEL:gemini-2.0-flash}
              temperature: ${SPRING_AI_VERTEX_CHAT_OPTIONS_TEMPERATURE:0.5}

    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
      chat:
        base-url: ${SPRING_AI_OPENAI_CHAT_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
        completions-path: ${SPRING_AI_OPENAI_CHAT_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:gemini-2.0-flash-lite}
          temperature: ${SPRING_AI_OPENAI_CHAT_OPTIONS_TEMPERATURE:0.0}
          max-tokens: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MAX_TOKENS:1024}

logging:
  structured:
    format:
      # ECS(Elastic Common Schema) JSON 포맷 — OTel Collector / Datadog Agent 호환
      # 환경변수 LOG_FORMAT으로 오버라이드 가능 (예: LOG_FORMAT=logstash)
      console: ${LOG_FORMAT:ecs}
  level:
    io:
      hlab:
        opencsp:
          infrastructure:
            security: INFO
            iam: INFO
            teleport: DEBUG
            k8s: DEBUG
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG

app:
  # IAM 공급자 선택
  # none    — 인증 없음 (기본값, 개발/데모용)
  # zitadel — Zitadel 기반 JWT 인증 (프로덕션)
  # APP_IAM_PROVIDER 환경변수로 오버라이드 가능
  iam:
    provider: ${APP_IAM_PROVIDER:none}

  ai:
    # true 로 설정하면 AiConfig 가 활성화되어 Spring AI 빈이 등록됨
    # APP_AI_ENABLED=true 환경변수로 오버라이드 가능
    enabled: ${APP_AI_ENABLED:false}

  config:
    # DB 설정 저장 시 민감값(sensitive=true) 암호화 키 (16자 이상 권장)
    # 프로덕션에서는 반드시 APP_CONFIG_ENCRYPTION_KEY 환경변수로 오버라이드할 것
    encryption-key: ${APP_CONFIG_ENCRYPTION_KEY:opencsp-dev-key!}

  k8s:
    # true → KubernetesClient + TofuControllerProvisioningClient 활성화
    # false (기본값) → NoOpProvisioningClient (경고 로그만 출력)
    enabled: ${APP_K8S_ENABLED:false}
    # 연결 방식 1: API server URL + Bearer token (설정 시 kubeconfig 무시)
    api-server: ${APP_K8S_API_SERVER:}   # e.g. https://192.168.1.100:6443
    token: ${APP_K8S_TOKEN:}             # k3s service account token
    trust-certs: ${APP_K8S_TRUST_CERTS:true}   # self-signed cert 허용
    # 연결 방식 2: kubeconfig 파일 경로 (api-server 미설정 시)
    kubeconfig: ${APP_K8S_KUBECONFIG:}
    # 연결 방식 3: in-cluster (위 둘 다 미설정 시 자동)
    flux:
      namespace: ${APP_K8S_FLUX_NAMESPACE:flux-system}
      git-repository-namespace: ${APP_K8S_FLUX_GIT_REPO_NAMESPACE:flux-system}
      interval: ${APP_K8S_FLUX_INTERVAL:10m}
      # Terraform runner Pod에 마운트할 SSH 키 Secret
      runner-ssh-secret: ${APP_K8S_FLUX_RUNNER_SSH_SECRET:pve-ssh-key}
      # varsFrom에 포함할 공통 Terraform Secret
      vars-from-secret: ${APP_K8S_FLUX_VARS_FROM_SECRET:terraform-secrets}
      # 모듈 타입 → GitRepository 내 경로 매핑 (미설정 시 코드 기본값 사용)
      # module-paths:
      #   proxmox-vm: ./bootstrap/terraform/provisions/proxmox-vm

# Zitadel IAM 설정 (app.iam.provider=zitadel 일 때 사용)
zitadel:
  issuer-uri: ${ZITADEL_ISSUER_URI:}
  client-id: ${ZITADEL_CLIENT_ID:}
  client-secret: ${ZITADEL_CLIENT_SECRET:}
  # domain은 프로토콜 포함 가능 (http:// 또는 https://) 또는 프로토콜 없이 도메인만
  domain: ${ZITADEL_DOMAIN:}
  org-id: ${ZITADEL_ORG_ID:}
  project-id: ${ZITADEL_PROJECT_ID:}
  api-token: ${ZITADEL_SERVICE_TOKEN:}
