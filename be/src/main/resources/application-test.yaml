spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # 테스트 환경에서는 Spring AI 자동 설정 비활성화
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

app:
  # 테스트에서는 Zitadel provider를 활성화하여 JWT 기반 보안 테스트 가능
  # ZitadelIamConfig가 JwtDecoder/ClientRegistrationRepository를 정적으로 등록 (네트워크 호출 없음)
  iam:
    provider: zitadel

# 테스트용 Zitadel 설정 (실제 서버 없이 테스트)
# ZitadelIamConfig는 NimbusJwtDecoder.withJwkSetUri()를 사용하므로 시작 시 연결하지 않음
zitadel:
  issuer-uri: http://localhost:9999
  client-id: ""
  client-secret: ""
  domain: http://localhost:9999
  org-id: test-org-id
  project-id: test-project-id
  api-token: test-api-token

logging:
  structured:
    format:
      console: ""  # 테스트에서는 텍스트 포맷으로 가독성 유지
  level:
    io.hlab.opencsp: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
