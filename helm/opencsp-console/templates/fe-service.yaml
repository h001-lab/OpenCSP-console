apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencsp-console.fullname" . }}-fe
  labels:
    {{- include "opencsp-console.labels" . | nindent 4 }}
    app.kubernetes.io/component: fe
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.fe.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "opencsp-console.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: fe
