# ─────────────────────────────────────────────
# BE (Spring Boot)
# ─────────────────────────────────────────────
be:
  image:
    repository: ghcr.io/h001-lab/opencsp-console-be
    tag: "latest"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 8080
  # 비민감 환경변수 — 키: 값 형태로 자유롭게 추가
  # 민감한 값(ENCRYPT_KEY, DB 비밀번호 등)은 existingSecret에 k8s Secret을 지정
  env:
    APP_IAM_PROVIDER: "none"
    APP_K8S_ENABLED: "false"
    # 프로덕션 DB 연결 예시 (H2 인메모리가 기본값)
    # SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/opencsp"
    # SPRING_DATASOURCE_DRIVER: "org.postgresql.Driver"
    # SPRING_JPA_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"
    # SPRING_DATASOURCE_POOL_SIZE: "5"
    #
    # ── IAM 연동 Option A (엔지니어용) ──────────────────────────────────────
    # Zitadel 자격증명을 env 변수로 직접 주입하는 방식.
    # existingSecret 에 아래 키를 포함한 k8s Secret을 지정하면 됩니다.
    # ConfigStore는 DB → env 순으로 값을 읽으므로 Secret에 값이 있으면 자동으로 사용됩니다.
    #
    # APP_IAM_PROVIDER: "zitadel"          # env로 직접 zitadel 모드 활성화
    # ZITADEL_ISSUER_URI: "https://..."    # ConfigCategory.IAM / zitadel.issuer-uri
    # ZITADEL_CLIENT_ID: "..."             # ConfigCategory.IAM / zitadel.client-id
    # ZITADEL_CLIENT_SECRET: "..."         # ConfigCategory.IAM / zitadel.client-secret
    # ZITADEL_ORG_ID: "..."                # ConfigCategory.IAM / zitadel.org-id
    # ZITADEL_PROJECT_ID: "..."            # ConfigCategory.IAM / zitadel.project-id
    # ZITADEL_SERVICE_TOKEN: "..."         # ConfigCategory.IAM / zitadel.service-token
    #
    # ── IAM 연동 Option B (일반 사용자용) ────────────────────────────────────
    # APP_IAM_PROVIDER: "none" (기본값) 으로 배포 후, 관리자 UI(/admin/integrations)에서
    # Zitadel 자격증명을 먼저 입력·저장한 다음 Provider를 Zitadel로 전환합니다.
    # 자격증명 없이 Provider를 전환하려 하면 BE가 400 오류를 반환하여 잠금 상태를 방지합니다.
  # 민감 환경변수를 담은 기존 k8s Secret 이름 (envFrom.secretRef)
  # 포함 권장 키: APP_CONFIG_ENCRYPTION_KEY, SPRING_DATASOURCE_USERNAME,
  #              SPRING_DATASOURCE_PASSWORD
  #              Option A 사용 시: ZITADEL_ISSUER_URI, ZITADEL_CLIENT_ID,
  #              ZITADEL_CLIENT_SECRET, ZITADEL_ORG_ID, ZITADEL_PROJECT_ID,
  #              ZITADEL_SERVICE_TOKEN, APP_IAM_PROVIDER
  existingSecret: ""
  resources: {}
  #   requests:
  #     cpu: 250m
  #     memory: 512Mi
  #   limits:
  #     cpu: 1000m
  #     memory: 1Gi

# ─────────────────────────────────────────────
# FE (Next.js)
# ─────────────────────────────────────────────
fe:
  image:
    repository: ghcr.io/h001-lab/opencsp-console-fe
    tag: "latest"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 3000
  # BACKEND_URL 미설정 시 차트 내부에서 BE ClusterIP 서비스 URL을 자동 생성
  env:
    BACKEND_URL: ""
    # NEXTAUTH_URL: "https://opencsp.example.com"
  # 민감 환경변수를 담은 기존 k8s Secret 이름 (envFrom.secretRef)
  # 포함 권장 키: AUTH_SECRET (또는 NEXTAUTH_SECRET), ZITADEL_ISSUER, ZITADEL_CLIENT_ID
  existingSecret: ""
  resources: {}

# ─────────────────────────────────────────────
# Ingress
# ─────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  #   nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: opencsp.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #   - secretName: opencsp-tls
  #     hosts:
  #       - opencsp.example.com

# ─────────────────────────────────────────────
# 공통
# ─────────────────────────────────────────────
imagePullSecrets: []
#   - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

# ─────────────────────────────────────────────
# PAM (Privileged Access Management) 통합
#
# BE에 PAM 도구의 sidecar를 주입해서 인증서/토큰을 받아오는 구조.
# provider 값에 따라 어떤 PAM 도구와 연동할지 결정.
#
# provider: ""           → PAM 통합 없음 (기본값)
# provider: "teleport"   → Teleport tbot sidecar 자동 주입
# provider: "<other>"    → 향후 추가 예정
#
# 공통 동작: BE 컨테이너의 identityMountPath에 PAM이 발급한 자격증명이 마운트됨.
# BE 앱은 provider에 상관없이 이 경로에서 인증서를 읽어 사용하면 됨.
# ─────────────────────────────────────────────
pam:
  provider: ""
  
  # BE 컨테이너 안에서 자격증명이 마운트될 경로 (provider 공통)
  identityMountPath: /var/pam/identity

  # ── Teleport 전용 설정 (provider: "teleport"일 때 사용) ──
  teleport:
    # Teleport 서버 주소. 클러스터 내부면 authServer 권장.
    # 둘 중 하나만 채우면 됨. 둘 다 비어있으면 chart render 시점에 fail.
    authServer: ""    # 예: teleport-teleport-cluster-auth.teleport.svc.cluster.local:3025
    proxyServer: ""   # 예: teleport.example.com:443
    
    # Teleport ProvisionToken 리소스 이름 (값이 아닌 이름 참조)
    token: ""
    
    # tbot이 K8s join 시 사용할 SA. chart가 만들어줌.
    serviceAccountName: opencsp-tbot
    
    image:
      repository: public.ecr.aws/gravitational/tbot-distroless
      tag: ""    # 비우면 Chart.appVersion 사용. tbot 버전을 명시하려면 직접 지정.
      pullPolicy: IfNotPresent
    
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi